[project]
name = "logstream"
version = "0.3.0"
description = "Real-time log anomaly detection service (FastAPI + Drain)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logstream = ["static/*.html"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
